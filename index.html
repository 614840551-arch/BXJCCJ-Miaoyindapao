<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景音乐</title>
</head>
<body>
<audio autoplay muted loop playsinline id="bgMusic">
    <source src="JX3-KUANG.mp3" type="audio/mpeg">

<button onclick="audioUnmute()">点击开启音乐声音</button>
<script>
let audio = document.getElementById("bgMusic");
function audioUnmute(){
    audio.muted = false;
}
// 兼容微信浏览器自动加载
document.addEventListener("WeixinJSBridgeReady",()=>{audio.play()})
</script>
</body>
</html>
